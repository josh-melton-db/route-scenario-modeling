command:
  - python
  - -m
  - backend.main
env:
  - name: DATA_BACKEND
    value: lakebase
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql_warehouse
  - name: LAKEBASE_APP_SCHEMA
    value: route_scenario_modeling
  - name: LAKEBASE_ENDPOINT
    valueFrom: lakebase
  - name: LAKEBASE_POOL_MIN_SIZE
    value: "1"
  - name: LAKEBASE_POOL_MAX_SIZE
    value: "5"
  - name: LAKEBASE_CONNECT_RETRIES
    value: "4"
  - name: NETWORK_RUN_MAX_WORKERS
    value: "2"
  - name: NETWORK_RUN_MAX_QUEUED
    value: "20"
  - name: NETWORK_RUN_MAX_ATTEMPTS
    value: "3"
  - name: NETWORK_RUN_RETENTION_PER_SCENARIO
    value: "50"
  - name: ROUTE_EXECUTION_MODE
    value: approximate_development
  - name: VALHALLA_ALLOW_HAVERSINE_FALLBACK
    value: "false"
