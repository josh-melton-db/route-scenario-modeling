resources:
  apps:
    valhalla_texas:
      name: valhalla-texas-${bundle.target}
      description: Texas truck routing for Dallas and San Antonio delivery planning
      source_code_path: ../valhalla_poc
      config:
        command: [bash, start.sh]
        env:
          - name: VALHALLA_VOLUME_PATH
            value_from: valhalla-assets
          - name: VALHALLA_REGION
            value: texas
      resources:
        - name: valhalla-assets
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.${var.schema}.valhalla_assets
            permission: READ_VOLUME
      permissions:
        - service_principal_name: ${resources.apps.route_scenario_modeling_app.service_principal_client_id}
          level: CAN_USE
