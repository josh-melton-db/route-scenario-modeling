resources:
  pipelines:
    route_scenario_modeling_pipeline:
      name: route-scenario-modeling-medallion-${bundle.target}
      catalog: ${var.catalog}
      target: ${resources.schemas.route_scenario_modeling_schema.name}
      root_path: ../pipelines
      libraries:
        - file:
            path: ../pipelines/bronze.sql
        - file:
            path: ../pipelines/silver.sql
        - file:
            path: ../pipelines/gold.sql
      serverless: true
      photon: true
      continuous: false
      development: true
      channel: current
      configuration:
        catalog: ${var.catalog}
        schema: ${resources.schemas.route_scenario_modeling_schema.name}
        raw_volume: ${resources.volumes.raw.name}
        raw_path: /Volumes/${var.catalog}/${resources.schemas.route_scenario_modeling_schema.name}/${resources.volumes.raw.name}
      permissions:
        - level: CAN_VIEW
          group_name: users
